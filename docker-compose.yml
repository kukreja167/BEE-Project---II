services:
  backend:
    build: .
    container_name: bee_backend
    ports:
      - "1890:1890"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/healthDb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:6
    container_name: bee_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: bee_redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:
